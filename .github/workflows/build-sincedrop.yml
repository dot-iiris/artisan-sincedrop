# Builds the Intel (x86_64) macOS DMG of the since-drop fork.
# Mirrors the macOS job in .appveyor.yml, on a GitHub-hosted Intel runner.
name: Build macOS Intel (since-drop)

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the DMG as a GitHub release'
        type: boolean
        default: false
  push:
    branches: [ sincedrop-5.0 ]
    paths: [ 'src/**', '.github/workflows/build-macos-intel.yml' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    env:
      PYTHON_V: '3.14'
      ARTISAN_OS: macos
      MACOSX_DEPLOYMENT_TARGET: '13.0' # official 5.0 Intel build supports macOS 13 Ventura+
      PYUIC: pyuic6
      PYLUPDATE: ./pylupdate6pro.py
      APPVEYOR: 'True' # build-macos3.sh refuses to run without it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64

      - name: Set paths and revision
        run: |
          uname -m
          SITE=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          echo "PYTHONSITEPKGS=$SITE" >> $GITHUB_ENV
          echo "QT_PATH=$SITE/PyQt6/Qt6" >> $GITHUB_ENV
          REV=$(git rev-parse --verify --short HEAD)
          sed -i '' -e "s/__revision__ = '.*'/__revision__ = '$REV'/" src/artisanlib/__init__.py
          sed -i '' -e "s/__artisan_os__ = '.*'/__artisan_os__ = 'macOS'/" src/artisanlib/__init__.py
          grep -n "__revision__\|__artisan_os__" src/artisanlib/__init__.py

      - name: Install requirements
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r src/requirements.txt | sed '/^Ignoring/d'
          touch $PYTHONSITEPKGS/google/__init__.py
          touch $PYTHONSITEPKGS/google/_upb/__init__.py
          touch $PYTHONSITEPKGS/google/protobuf/__init__.py
          touch $PYTHONSITEPKGS/google/protobuf/internal/__init__.py

      - name: Build
        working-directory: src
        run: |
          chmod +x *.sh pylupdate6pro.py
          ./build-macos3.sh
          mv artisan-mac-*.dmg artisan-mac-intel-5.0.0-sincedrop.dmg
          ls -la *.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: artisan-mac-intel-5.0.0-sincedrop
          path: src/artisan-mac-intel-5.0.0-sincedrop.dmg
          retention-days: 30

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v5.0.0-sincedrop src/artisan-mac-intel-5.0.0-sincedrop.dmg \
            --target "$GITHUB_SHA" --title "Artisan 5.0.0 since-drop (macOS Intel)" \
            --notes "Artisan 5.0.0 with the Since DROP LCD (View > Since DROP LCD). Unofficial build, not signed or notarized: right-click the app and choose Open the first time." \
            || gh release upload v5.0.0-sincedrop src/artisan-mac-intel-5.0.0-sincedrop.dmg --clobber
